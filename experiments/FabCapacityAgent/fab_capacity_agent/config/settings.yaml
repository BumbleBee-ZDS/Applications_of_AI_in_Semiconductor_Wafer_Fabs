# =============================================================================
# FabCapacityAgent - 半导体晶圆厂AI Agent产能系统配置文件
# =============================================================================

# -----------------------------------------------------------------------------
# 数据库配置 (Database Configuration)
# -----------------------------------------------------------------------------
database:
  path: "data/fab_capacity.db"        # SQLite数据库路径
  backup_path: "data/backup/"         # 备份目录
  auto_init: true                     # 首次运行自动初始化数据

# -----------------------------------------------------------------------------
# 产线基础参数 (Fabrication Line Parameters)
# -----------------------------------------------------------------------------
production:
  wafer_size: 300                     # 晶圆尺寸(mm)
  wafers_per_lot: 25                  # 每批晶圆数量
  operating_hours: 168                # 每周运行小时数(24x7)
  pm_ratio: 0.05                      # 预防性维护占比(5%)
  
  # 8道主工序配置 (8 Main Process Steps)
  # PHOTO(光刻), ETCH(刻蚀), DEPO(沉积), IMP(离子注入)
  # DIFF(扩散), CMP(抛光), METRO(量测), WET(清洗)
  processes:
    PHOTO:
      name_cn: "光刻"
      process_time: 2.5               # 标准工序时间(h)
      equipment_type: "Scanner"
      description: "光刻曝光工序，使用Scanner进行晶圆图案转移"
    ETCH:
      name_cn: "刻蚀"
      process_time: 1.8
      equipment_type: "Etcher"
      description: "刻蚀工序，使用Etcher进行图案蚀刻"
    DEPO:
      name_cn: "沉积"
      process_time: 3.2
      equipment_type: "Deposition"
      description: "薄膜沉积工序，使用Deposition设备进行材料沉积"
    IMP:
      name_cn: "离子注入"
      process_time: 1.2
      equipment_type: "Implanter"
      description: "离子注入工序，使用Implanter进行掺杂"
    DIFF:
      name_cn: "扩散"
      process_time: 6.0
      equipment_type: "Furnace"
      description: "热扩散/氧化工序，使用Furnace进行高温处理"
    CMP:
      name_cn: "抛光"
      process_time: 1.5
      equipment_type: "CMP_Tool"
      description: "化学机械抛光工序，使用CMP_Tool进行平坦化"
    METRO:
      name_cn: "量测"
      process_time: 0.8
      equipment_type: "Metrology"
      description: "量测工序，使用Metrology设备进行参数检测"
    WET:
      name_cn: "清洗"
      process_time: 1.0
      equipment_type: "Wet_Bench"
      description: "湿法清洗工序，使用Wet_Bench进行晶圆清洗"
  
  # 工艺路线: 每种产品的工序序列
  process_routes:
    Logic_A: ["WET", "PHOTO", "ETCH", "DEPO", "IMP", "DIFF", "CMP", "METRO"]
    Logic_B: ["WET", "PHOTO", "ETCH", "IMP", "DEPO", "DIFF", "CMP", "METRO"]
    Memory_C: ["WET", "PHOTO", "DEPO", "ETCH", "IMP", "CMP", "DIFF", "METRO"]
  
  # 产品配置
  products:
    Logic_A:
      name_cn: "逻辑芯片A"
      priority: 1
      layers: 12
      base_yield: 0.92
    Logic_B:
      name_cn: "逻辑芯片B"
      priority: 2
      layers: 10
      base_yield: 0.94
    Memory_C:
      name_cn: "存储芯片C"
      priority: 3
      layers: 8
      base_yield: 0.96

# -----------------------------------------------------------------------------
# 设备配置 (Equipment Configuration)
# -----------------------------------------------------------------------------
equipment:
  total_count: 120                    # 设备总台数
  # 各工序设备数量分配
  distribution:
    PHOTO: 20
    ETCH: 18
    DEPO: 18
    IMP: 15
    DIFF: 12
    CMP: 15
    METRO: 12
    WET: 10
  # 设备状态
  statuses:
    - "RUN"       # 运行中
    - "IDLE"      # 空闲
    - "DOWN"      # 故障停机
    - "PM"        # 预防性维护
    - "SETUP"     # 换型/调试

# -----------------------------------------------------------------------------
# 模拟数据生成器配置 (Data Generator Configuration)
# -----------------------------------------------------------------------------
data_generator:
  history_days: 90                    # 历史数据天数
  lots_per_day: 60                    # 日均入库批次
  lot_history_records: 70000          # lot_history目标记录数(5-8万)
  seed: 42                            # 随机种子，保证可复现
  # OEE基准参数
  oee_benchmark:
    availability: 0.90                # 可用率基准
    performance: 0.85                 # 性能率基准
    quality: 0.95                     # 良率基准
  # 故障模拟参数
  failure_params:
    mtbf: 48                          # 平均无故障时间(h)
    mttr: 4                           # 平均修复时间(h)
    pm_frequency: 168                 # PM间隔(h)
    pm_duration: 8                    # PM持续时间(h)

# -----------------------------------------------------------------------------
# Agent配置 (Agent Framework Configuration)
# -----------------------------------------------------------------------------
agent:
  orchestrator:
    timeout: 300                      # 全链路超时时间(秒)
    max_retries: 2                    # 失败重试次数
    log_level: "INFO"                 # 日志级别
  
  perception_agent:
    data_window: 24                   # 数据采集时间窗口(h)
    sample_interval: 5                # 采样间隔(min)
  
  analysis_agent:
    trend_window_days: 30             # 趋势分析窗口(天)
    anomaly_threshold: 2.0            # 异常阈值(Z-score)
    bottleneck_threshold: 0.85        # 瓶颈判定阈值(利用率)
  
  decision_agent:
    forecast_horizon_short: 7         # 短期预测天数
    forecast_horizon_long: 30         # 长期预测天数
    confidence_level: 0.95            # 置信区间水平
    use_llm: false                    # 是否使用LLM增强(预留接口)
  
  execution_agent:
    auto_save_report: true            # 自动保存报告
    report_format: "markdown"         # 报告格式
    output_dir: "data/reports/"       # 报告输出目录

# -----------------------------------------------------------------------------
# 预测服务配置 (Prediction Service Configuration)
# -----------------------------------------------------------------------------
prediction:
  moving_average_window: 7            # 移动平均窗口(天)
  linear_regression_window: 30        # 线性回归窗口(天)
  seasonality_period: 7               # 季节性周期(天)
  
  # LLM增强预测配置(预留接口)
  llm_enhancement:
    enabled: false
    provider: "deepseek"              # deepseek / qwen
    model: "deepseek-chat"
    max_tokens: 1024
    temperature: 0.3

# -----------------------------------------------------------------------------
# Streamlit UI配置 (UI Configuration)
# -----------------------------------------------------------------------------
ui:
  page_title: "FabCapacityAgent - 晶圆厂AI产能智能中枢"
  page_icon: "🏭"
  layout: "wide"
  initial_sidebar_state: "expanded"
  
  # 主题色: 深蓝科技风
  theme:
    primaryColor: "#1E3A5F"           # 深蓝主色
    backgroundColor: "#0A1628"        # 背景色
    secondaryBackgroundColor: "#162447"
    textColor: "#E8EDF3"
    accentColor: "#00D4FF"            # 青色强调色
    successColor: "#00FF94"
    warningColor: "#FFB800"
    dangerColor: "#FF4D6D"
  
  # 图表配色
  chart_colors:
    - "#00D4FF"
    - "#FF6B9D"
    - "#C084FC"
    - "#34D399"
    - "#FBBF24"
    - "#F87171"
    - "#60A5FA"
    - "#A78BFA"

# -----------------------------------------------------------------------------
# What-If模拟器配置 (Simulator Configuration)
# -----------------------------------------------------------------------------
simulator:
  max_equipment_add: 10               # 最大新增设备数
  oee_adjust_range: [0.60, 0.99]      # OEE调整范围
  max_new_products: 3                 # 最大新产品数
  monte_carlo_iterations: 100         # 蒙特卡洛迭代次数
