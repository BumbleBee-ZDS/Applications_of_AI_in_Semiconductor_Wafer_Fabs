# FabGraph MVP 配置文件
# ${VAR:default} 形式的占位符由 config.py 从环境变量展开

app:
  name: FabGraph MVP
  version: 0.1.0
  host: ${APP_HOST:0.0.0.0}
  port: ${APP_PORT:8000}
  debug: ${APP_DEBUG:false}
  log_level: ${APP_LOG_LEVEL:INFO}

# LLM：无 API Key 时 use_mock=true，使用预设响应
llm:
  provider: ${LLM_PROVIDER:deepseek}   # openai | deepseek
  use_mock: ${USE_MOCK_LLM:true}
  openai:
    api_key: ${OPENAI_API_KEY:}
    base_url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: 0.0
    max_tokens: 2048
  deepseek:
    api_key: ${DEEPSEEK_API_KEY:}
    base_url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    temperature: 0.0
    max_tokens: 2048

# 向量嵌入：无模型时 use_mock=true，使用 TF-IDF 兜底
embedding:
  use_mock: ${USE_MOCK_EMBEDDINGS:true}
  model_name: ${EMBEDDING_MODEL:all-MiniLM-L6-v2}
  dimension: 384
  batch_size: 32

# SQLite 元数据库
database:
  sqlite_path: ${SQLITE_DB_PATH:data/fabgraph.db}

# FAISS 向量索引
vector:
  faiss_index_path: ${FAISS_INDEX_PATH:data/faiss_index}
  top_k: 10

# 图谱持久化（pickle 快照）
graph:
  schema_graph_pickle: data/schema_graph.pkl
  lineage_graph_pickle: data/lineage_graph.pkl

# 模拟数据目录
data:
  mock_oracle_dir: data/mock_oracle

# 语义搜索
search:
  top_k: 10
  hop_expansion: 1            # 图谱 1-hop 关联扩展

# NL2SQL
nl2sql:
  max_join_hops: 3            # JOIN 路径最大跳数
  include_lineage: true       # 是否在 Prompt 中注入血缘信息
