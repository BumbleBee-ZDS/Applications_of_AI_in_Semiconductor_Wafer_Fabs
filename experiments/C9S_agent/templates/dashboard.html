<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaferFab-Agent-K8s - 仪表盘</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WaferFab-Agent-K8s</h1>
            <p>基于 Kubernetes 控制论思想的半导体晶圆厂 Agent 编排系统</p>
            <div class="k8s-note">
                <strong>💡 系统设计理念：</strong>本系统基于 Kubernetes 控制论思想：声明式期望状态 + 调谐循环自动收敛。系统持续观察当前状态，与期望状态（所有 Lot 完成）对比，自动执行操作使系统收敛。
            </div>
            <div class="nav-links">
                <a href="/">仪表盘</a>
                <a href="/compare">架构对比</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" id="stat-total">0</div>
                <div class="label">总批次</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-completed">0</div>
                <div class="label">已完成</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-running">0</div>
                <div class="label">运行中</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-failed">0</div>
                <div class="label">已失败</div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-title">
                    <span>📋</span> 批次状态列表
                    <button class="btn btn-primary" style="float:right; margin-top:-5px;" onclick="showAddLotForm()">+ 新建批次</button>
                </div>
                <table class="table" id="lots-table">
                    <thead>
                        <tr>
                            <th>批次ID</th>
                            <th>产品类型</th>
                            <th>当前步骤</th>
                            <th>进度</th>
                            <th>状态</th>
                            <th>设备</th>
                            <th>失败次数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <div class="card-title"><span>🔧</span> 设备组状态</div>
                <div class="chart-container">
                    <canvas id="toolsChart"></canvas>
                </div>
                <table class="table" style="margin-top: 15px;">
                    <thead>
                        <tr>
                            <th>设备组</th>
                            <th>类型</th>
                            <th>可用</th>
                            <th>繁忙</th>
                            <th>利用率</th>
                        </tr>
                    </thead>
                    <tbody id="tools-table">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span>📝</span> 调谐循环日志</div>
            <div class="log-container" id="logs-container">
            </div>
        </div>

        <div id="addLotModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
            <div style="background:white; padding:30px; border-radius:12px; width:400px;">
                <h3>新建晶圆批次</h3>
                <div class="form-group">
                    <label>产品类型</label>
                    <select id="productType">
                        <option value="Logic">Logic（逻辑芯片）</option>
                        <option value="Memory">Memory（存储芯片）</option>
                        <option value="Analog">Analog（模拟芯片）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>工艺步骤数</label>
                    <select id="stepCount">
                        <option value="3">3 步</option>
                        <option value="4">4 步</option>
                        <option value="5">5 步</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="addLot()">创建</button>
                <button class="btn" style="background:#eee; margin-left:10px;" onclick="document.getElementById('addLotModal').style.display='none'">取消</button>
            </div>
        </div>
    </div>

    <script>
        let toolsChart = null;

        function showAddLotForm() {
            document.getElementById('addLotModal').style.display = 'flex';
        }

        async function addLot() {
            const productType = document.getElementById('productType').value;
            const stepCount = parseInt(document.getElementById('stepCount').value);
            
            const response = await fetch('/api/lots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_type: productType, steps_count: stepCount })
            });
            
            if (response.ok) {
                document.getElementById('addLotModal').style.display = 'none';
                updateDashboard();
            }
        }

        async function deleteLot(lotId) {
            if (confirm(`确定要删除批次 ${lotId} 吗？`)) {
                await fetch(`/api/lots/${lotId}`, { method: 'DELETE' });
                updateDashboard();
            }
        }

        async function updateDashboard() {
            const [lotsRes, toolsRes, logsRes, metricsRes] = await Promise.all([
                fetch('/api/lots'),
                fetch('/api/tools'),
                fetch('/api/logs'),
                fetch('/api/metrics')
            ]);
            
            const lots = await lotsRes.json();
            const tools = await toolsRes.json();
            const logs = await logsRes.json();
            const metrics = await metricsRes.json();

            updateStats(metrics);
            updateLotsTable(lots);
            updateToolsTable(tools);
            updateToolsChart(tools);
            updateLogs(logs);
        }

        function updateStats(metrics) {
            document.getElementById('stat-total').textContent = metrics.total_lots;
            document.getElementById('stat-completed').textContent = metrics.completed_lots;
            document.getElementById('stat-running').textContent = metrics.running_lots;
            document.getElementById('stat-failed').textContent = metrics.failed_lots;
        }

        function updateLotsTable(lots) {
            const tbody = document.getElementById('lots-table').querySelector('tbody');
            tbody.innerHTML = lots.map(lot => `
                <tr>
                    <td>${lot.id}</td>
                    <td>${lot.product_type}</td>
                    <td>${lot.current_step} (${lot.current_step_index + 1}/${lot.total_steps})</td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${lot.progress_percent}%"></div>
                        </div>
                        <div class="progress-text">${lot.progress_percent}%</div>
                    </td>
                    <td><span class="status-badge status-${lot.status}">${getStatusText(lot.status)}</span></td>
                    <td>${lot.assigned_tool || '-'}</td>
                    <td>${lot.error_count}</td>
                    <td><button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteLot('${lot.id}')">删除</button></td>
                </tr>
            `).join('');
        }

        function getStatusText(status) {
            const map = { pending: '等待中', running: '运行中', completed: '已完成', failed: '已失败' };
            return map[status] || status;
        }

        function updateToolsTable(tools) {
            const tbody = document.getElementById('tools-table');
            tbody.innerHTML = tools.map(t => `
                <tr>
                    <td>${t.name}</td>
                    <td>${t.tool_type}</td>
                    <td>${t.available_tools}</td>
                    <td>${t.busy_tools}</td>
                    <td>${t.utilization}%</td>
                </tr>
            `).join('');
        }

        function updateToolsChart(tools) {
            const ctx = document.getElementById('toolsChart').getContext('2d');
            
            if (toolsChart) {
                toolsChart.destroy();
            }

            toolsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: tools.map(t => t.name),
                    datasets: [
                        {
                            label: '可用',
                            data: tools.map(t => t.available_tools),
                            backgroundColor: '#4caf50',
                            borderRadius: 4
                        },
                        {
                            label: '繁忙',
                            data: tools.map(t => t.busy_tools),
                            backgroundColor: '#ff5722',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    },
                    plugins: {
                        legend: { position: 'top' }
                    }
                }
            });
        }

        function updateLogs(logs) {
            const container = document.getElementById('logs-container');
            container.innerHTML = logs.map(log => `
                <div class="log-item log-${log.level.toLowerCase()}">
                    <span class="log-timestamp">[${log.timestamp}]</span>
                    <span class="log-source">${log.source}</span>
                    <span>${log.message}</span>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
